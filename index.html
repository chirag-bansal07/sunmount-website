<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Per-route tags: scripts/prerender.mjs rewrites this block for every page
         from src/seo/routes.js. The values below are the homepage defaults (dev). -->
    <!-- seo:start -->
    <title>SunMount® | Solar Mounting Structures | India's Premium Manufacturer</title>
    <meta name="description" content="India's indigenous solar PV mounting manufacturer. ISO 9001 &amp; TÜV SÜD certified Mono, Mini, Long Rail, Standing Seam &amp; FRP Walkway systems engineered for 200 km/h wind loads." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.sunmount.in/" />
    <meta property="og:title" content="SunMount® | Solar Mounting Structures | India's Premium Manufacturer" />
    <meta property="og:description" content="India's indigenous solar PV mounting manufacturer. ISO 9001 &amp; TÜV SÜD certified Mono, Mini, Long Rail, Standing Seam &amp; FRP Walkway systems engineered for 200 km/h wind loads." />
    <meta property="og:url" content="https://www.sunmount.in/" />
    <meta property="og:image" content="https://www.sunmount.in/og-default.jpg" />
    <meta name="twitter:title" content="SunMount® | Solar Mounting Structures | India's Premium Manufacturer" />
    <meta name="twitter:description" content="India's indigenous solar PV mounting manufacturer. ISO 9001 &amp; TÜV SÜD certified Mono, Mini, Long Rail, Standing Seam &amp; FRP Walkway systems engineered for 200 km/h wind loads." />
    <meta name="twitter:image" content="https://www.sunmount.in/og-default.jpg" />
    <!-- seo:end -->

    <!-- Open Graph / Twitter (same on every page) -->
    <meta property="og:site_name" content="Sunmount Solutions" />
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SunMount solar mounting structures" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preload the hero (LCP) image — responsive, so phones fetch a small one -->
    <link rel="preload" as="image" href="/factory-1280.webp"
          imagesrcset="/factory-640.webp 640w, /factory-960.webp 960w, /factory-1280.webp 1280w, /factory-1600.webp 1600w"
          imagesizes="100vw" fetchpriority="high" />

    <!-- Fonts: self-hosted (no third-party connection), preloaded, with
         metric-matched local fallbacks so the swap from Arial/Courier to the
         web font doesn't shift the layout (CLS). Metrics computed with fontTools. -->
    <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face{font-family:'Montserrat';font-style:normal;font-weight:400 900;font-display:swap;src:url(/fonts/montserrat-latin.woff2) format('woff2')}
      @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/jetbrains-mono-latin.woff2) format('woff2')}
      @font-face{font-family:'Montserrat Fallback';src:local('Arial');size-adjust:125.13%;ascent-override:77.36%;descent-override:20.06%;line-gap-override:0%}
      @font-face{font-family:'JetBrains Mono Fallback';src:local('Courier New');size-adjust:99.98%;ascent-override:102.02%;descent-override:30%;line-gap-override:0%}
    </style>
